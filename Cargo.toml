[package]
name = "kvreap"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Drop-in evictor for llm-d filesystem KV-cache PVCs that keeps metadata load off the shared filesystem"
repository = "https://github.com/wseaton/kvreap"

[dependencies]
anyhow = "1.0.104"
fastrand = "2.5.0"
rmp = "0.8.15"
rustix = { version = "1.1.5", features = ["fs"] }
serde_json = "1.0.151"
signal-hook = "0.4.5"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zmq = "0.10.0"

[dev-dependencies]
rustix = { version = "1.1.5", features = ["fs", "process"] }
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
