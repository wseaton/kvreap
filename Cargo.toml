[package]
name = "kvreap"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Drop-in evictor for llm-d filesystem KV-cache PVCs that keeps metadata load off the shared filesystem"
repository = "https://github.com/wseaton/kvreap"

[dependencies]
anyhow = "1.0.104"
fastrand = "2.5.0"
rmp = { version = "0.8.15", optional = true }
rustix = { version = "1.1.5", features = ["fs"] }
serde_json = "1.0.151"
signal-hook = "0.4.5"
thiserror = "2.0.21"
tokio = { version = "1.53.2", default-features = false, features = ["rt", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zeromq = { version = "0.6.0", default-features = false, features = ["tokio-runtime", "tcp-transport"] }
zmq = { version = "0.10.0", optional = true }

[features]
# Publishing BlockRemoved events over libzmq. Off by default: libzmq links its
# own SHA-1. Subscribing to vLLM's KV events uses the pure-Rust zeromq crate.
events = ["dep:rmp", "dep:zmq"]

[dev-dependencies]
bytes = "1.11.1"
rmp = "0.8.15"
rustix = { version = "1.1.5", features = ["fs", "process"] }
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
