# Opt-in scraping for the kvreap Component: a PodMonitor for its metrics port
# and a NetworkPolicy that admits only the monitoring namespace. Include it
# after ../kvreap in an overlay that provides the kvreap-target ConfigMap.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - monitoring.yaml
replacements:
  - source:
      kind: ConfigMap
      name: kvreap-target
      fieldPath: data.llmisvc
    targets:
      - select:
          kind: PodMonitor
        fieldPaths:
          - metadata.name
          - metadata.labels.[app.kubernetes.io/name]
          - spec.selector.matchLabels.[app.kubernetes.io/name]
        options:
          delimiter: "-"
          index: 0
      - select:
          kind: NetworkPolicy
          name: LLMISVC_NAME-kvreap-metrics
        fieldPaths:
          - metadata.name
          - metadata.labels.[app.kubernetes.io/name]
          - spec.podSelector.matchLabels.[app.kubernetes.io/name]
        options:
          delimiter: "-"
          index: 0
