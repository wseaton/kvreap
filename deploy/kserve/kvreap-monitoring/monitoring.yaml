# Prometheus scraping for the kvreap Deployment from deploy/kserve/kvreap.
# Needs the Prometheus Operator CRDs (OpenShift user workload monitoring,
# kube-prometheus-stack).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: LLMISVC_NAME-kvreap
  labels:
    app.kubernetes.io/name: LLMISVC_NAME
    app.kubernetes.io/component: kvreap
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: LLMISVC_NAME
      app.kubernetes.io/component: kvreap
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      scheme: http
      interval: 30s
---
# kvreap takes no other inbound traffic; only the namespaces OpenDataHub
# admits for scraping LLMInferenceService pods may reach its metrics port.
# Add your Prometheus's namespace if it runs elsewhere.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: LLMISVC_NAME-kvreap-metrics
  labels:
    app.kubernetes.io/name: LLMISVC_NAME
    app.kubernetes.io/component: kvreap
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: LLMISVC_NAME
      app.kubernetes.io/component: kvreap
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-user-workload-monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redhat-ods-monitoring
      ports:
        - port: 9090
          protocol: TCP
