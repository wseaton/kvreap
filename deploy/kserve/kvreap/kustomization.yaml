# Per-LLMInferenceService kvreap: headless Service over the workload pods,
# the evictor Deployment on the shared KV cache PVC, and a NetworkPolicy for
# the KV events port. The including overlay provides a local-config ConfigMap
# named kvreap-target with data.llmisvc, data.pvc and data.kvEventsEndpoint.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - kvreap.yaml
replacements:
  - source:
      kind: ConfigMap
      name: kvreap-target
      fieldPath: data.llmisvc
    targets:
      - select:
          kind: Service
        fieldPaths:
          - metadata.name
          - metadata.labels.[app.kubernetes.io/name]
          - spec.selector.[app.kubernetes.io/name]
        options:
          delimiter: "-"
          index: 0
      - select:
          kind: Deployment
        fieldPaths:
          - metadata.name
          - metadata.labels.[app.kubernetes.io/name]
          - spec.selector.matchLabels.[app.kubernetes.io/name]
          - spec.template.metadata.labels.[app.kubernetes.io/name]
        options:
          delimiter: "-"
          index: 0
      - select:
          kind: NetworkPolicy
        fieldPaths:
          - metadata.name
          - metadata.labels.[app.kubernetes.io/name]
          - spec.podSelector.matchLabels.[app.kubernetes.io/name]
          - spec.ingress.1.from.0.podSelector.matchLabels.[app.kubernetes.io/name]
          - spec.ingress.1.from.1.podSelector.matchLabels.[app.kubernetes.io/name]
        options:
          delimiter: "-"
          index: 0
  - source:
      kind: ConfigMap
      name: kvreap-target
      fieldPath: data.kvEventsEndpoint
    targets:
      - select:
          kind: Deployment
        fieldPaths:
          - spec.template.spec.containers.[name=kvreap].env.[name=KV_EVENTS_ENDPOINTS].value
  - source:
      kind: ConfigMap
      name: kvreap-target
      fieldPath: data.pvc
    targets:
      - select:
          kind: Deployment
        fieldPaths:
          - spec.template.spec.volumes.[name=kv-cache].persistentVolumeClaim.claimName
