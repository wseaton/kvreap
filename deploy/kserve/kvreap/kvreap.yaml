# One kvreap per shared KV cache PVC. Replace LLMISVC_NAME with the
# LLMInferenceService name and KV_CACHE_PVC with its kvCacheOffloading
# secondary[0].fileSystem.pvc.ref.name (kustomization.yaml does both).
apiVersion: v1
kind: Service
metadata:
  name: LLMISVC_NAME-kv-events
  labels:
    app.kubernetes.io/name: LLMISVC_NAME
    app.kubernetes.io/component: kvreap
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/part-of: llminferenceservice
    app.kubernetes.io/name: LLMISVC_NAME
    kserve.io/component: workload
  ports:
    - name: tcp-kv-events
      port: 5557
      targetPort: 5557
      protocol: TCP
    - name: tcp-kv-replay
      port: 5558
      targetPort: 5558
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: LLMISVC_NAME-kvreap
  labels:
    app.kubernetes.io/name: LLMISVC_NAME
    app.kubernetes.io/component: kvreap
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: LLMISVC_NAME
      app.kubernetes.io/component: kvreap
  template:
    metadata:
      labels:
        app.kubernetes.io/name: LLMISVC_NAME
        app.kubernetes.io/component: kvreap
    spec:
      # No uid here: on OpenShift the restricted-v2 SCC gives every pod in the
      # namespace the same uid, so kvreap can unlink what vLLM writes. Elsewhere
      # patch runAsUser (or fsGroup) to match vLLM's.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kvreap
          image: quay.io/wseaton/kvreap:latest
          env:
            - name: PVC_MOUNT_PATH
              value: /kv-cache
            - name: CACHE_DIRECTORY
              value: "."
            - name: CLEANUP_THRESHOLD
              value: "85"
            - name: TARGET_THRESHOLD
              value: "70"
            - name: FILE_ACCESS_TIME_THRESHOLD_MINUTES
              value: "2"
            - name: KV_EVENTS_ENDPOINTS
              value: tcp://LLMISVC_NAME-kv-events:5557
            - name: KV_EVENTS_REPLAY_PORT
              value: "5558"
            - name: KV_EVENTS_DISK_MEDIUM
              value: STORAGE
            - name: METRICS_ADDR
              value: 0.0.0.0:9090
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: kv-cache
              mountPath: /kv-cache
      volumes:
        - name: kv-cache
          persistentVolumeClaim:
            claimName: KV_CACHE_PVC
