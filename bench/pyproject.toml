[project]
name = "kvbench"
version = "0.1.0"
description = "PVC evictor A/B/C benchmark against vLLM with filesystem KV offloading"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0.2"]

[project.scripts]
kvbench = "kvbench.cli:main"

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.14", "pyright>=1.1.400"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.pyright]
exclude = ["vllm_plugins", ".venv"]
