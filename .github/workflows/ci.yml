name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all --benches --tests --examples --all-features -- -D warnings
      - name: Mount a dedicated 64 MiB tmpfs for the threshold e2e tests
        run: |
          sudo mkdir -p /mnt/kvreap-e2e
          sudo mount -t tmpfs -o size=64m tmpfs /mnt/kvreap-e2e
          sudo chown "$(id -u):$(id -g)" /mnt/kvreap-e2e
      - run: cargo test --locked --all-targets -- --include-ignored
        env:
          KVREAP_E2E_DIR: /mnt/kvreap-e2e

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t kvreap:ci .
      - run: tests/container-smoke.sh kvreap:ci
