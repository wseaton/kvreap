# kind e2e: the kvreap component from deploy/kserve against a fake vLLM labelled
# like a KServe workload pod, sharing one PVC.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kvreap-e2e
resources:
  - namespace.yaml
  - target.yaml
  - pvc.yaml
components:
  - ../../../deploy/kserve/kvreap
images:
  - name: quay.io/wseaton/kvreap
    newName: kvreap
    newTag: e2e
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: e2e-model-kvreap
      spec:
        template:
          spec:
            containers:
              - name: kvreap
                imagePullPolicy: Never
                env:
                  - name: FILE_ACCESS_TIME_THRESHOLD_MINUTES
                    value: "0.25"
                  - name: LOGGER_INTERVAL_SECONDS
                    value: "0.5"
