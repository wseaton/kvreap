# Labelled like a KServe LLMInferenceService workload pod so the component's
# headless Service selects it. The KV events PUB is reached through a
# toxiproxy sidecar on 5557, so e2e.sh can cut the stream; the replay socket
# on 5558 is direct.
#
# Two tiers as with deploy/kserve/preset-tiered: a node-local emptyDir
# (LOCAL, evicted by the kvreap sidecar, which mirrors the preset's) and the
# shared PVC (REMOTE, evicted by the kvreap Deployment).
apiVersion: v1
kind: ConfigMap
metadata:
  name: toxiproxy
data:
  proxies.json: |
    [{"name": "kv-events", "listen": "0.0.0.0:5557", "upstream": "127.0.0.1:15557", "enabled": true}]
---
apiVersion: v1
kind: Pod
metadata:
  name: fake-vllm
  labels:
    app.kubernetes.io/part-of: llminferenceservice
    app.kubernetes.io/name: e2e-model
    kserve.io/component: workload
spec:
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containers:
    - name: main
      image: fake-vllm:e2e
      imagePullPolicy: Never
      args: ["serve"]
      env:
        - {name: ROOT, value: /mnt/kv-cache-1}
        - {name: LOCAL_ROOT, value: /mnt/kv-cache-0}
        - {name: PUB_PORT, value: "15557"}
        - {name: REPLAY_PORT, value: "5558"}
      ports:
        - {name: tcp-kv-replay, containerPort: 5558}
      volumeMounts:
        - {name: kv-cache-secondary-0, mountPath: /mnt/kv-cache-0}
        - {name: kv-cache-secondary-1, mountPath: /mnt/kv-cache-1}
    - name: kvreap
      image: kvreap:e2e
      imagePullPolicy: Never
      env:
        - {name: PVC_MOUNT_PATH, value: /kv-cache}
        - {name: CACHE_DIRECTORY, value: "."}
        - {name: CAPACITY_BYTES, value: "536870912"}
        - {name: CLEANUP_THRESHOLD, value: "70"}
        - {name: TARGET_THRESHOLD, value: "50"}
        - {name: FILE_ACCESS_TIME_THRESHOLD_MINUTES, value: "0.25"}
        - {name: LOGGER_INTERVAL_SECONDS, value: "0.5"}
        - {name: KV_EVENTS_ENDPOINTS, value: tcp://127.0.0.1:5557}
        - {name: KV_EVENTS_REPLAY_PORT, value: "5558"}
        - {name: KV_EVENTS_DISK_MEDIUM, value: STORAGE}
        - {name: KV_EVENTS_LOCALITY, value: LOCAL}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      volumeMounts:
        - {name: kv-cache-secondary-0, mountPath: /kv-cache}
    - name: toxiproxy
      image: ghcr.io/shopify/toxiproxy:2.12.0
      imagePullPolicy: Never
      args: ["-host=0.0.0.0", "-config=/config/proxies.json"]
      ports:
        - {name: tcp-kv-events, containerPort: 5557}
      volumeMounts:
        - {name: toxiproxy, mountPath: /config}
  volumes:
    - name: kv-cache-secondary-0
      emptyDir:
        sizeLimit: 640Mi
    - name: kv-cache-secondary-1
      persistentVolumeClaim:
        claimName: e2e-kv-cache
    - name: toxiproxy
      configMap:
        name: toxiproxy
